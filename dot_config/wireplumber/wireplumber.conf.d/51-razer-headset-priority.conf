# Prefer the directly connected BlackShark while it is charging, then fall
# back to the wireless dongle when the USB cable is disconnected.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-Razer_Inc_BlackShark_V3_Pro_USB_0000000000000000-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-Razer_Inc_BlackShark_V3_Pro_0000000000000000-00.pro-output-1"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2500
      }
    }
  }
]
