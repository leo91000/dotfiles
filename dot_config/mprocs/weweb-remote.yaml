procs:
  ww:editor:
    shell: 'cd "$WW_MONOREPO_ROOT/services/weweb-editor" && VITE_APP_IS_EDITOR_DEV="$WW_EDITOR_DEV" exec npm exec -- vite --mode "$WW_EDITOR_MODE"'
    autorestart: true
  ww:front:
    shell: 'cd "$WW_MONOREPO_ROOT/services/weweb-editor" && VITE_APP_IS_EDITOR_DEV="$WW_EDITOR_DEV" FRONT=true exec npm exec -- vite --mode "$WW_EDITOR_MODE"'
    autorestart: true
  ww:dashboard:
    shell: 'cd "$WW_MONOREPO_ROOT/services/weweb-dashboard" && exec npm exec -- vue-cli-service serve --mode "$WW_DASHBOARD_MODE" --port=4042'
    autorestart: true
